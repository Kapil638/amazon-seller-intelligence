[project]
name = "amazon-seller-intelligence-api"
version = "0.1.0"
description = "FastAPI backend for Amazon Seller Intelligence (Milestone 9)"
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "openai>=1.99.0",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
